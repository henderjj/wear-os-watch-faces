# Checks every watch face (and the template) on each pull request and on pushes to main.
# See docs/agentic-wear-os-watch-faces.md for what each check catches.
name: Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Validate and test watch faces
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tools/requirements.txt

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Python packages
        run: python -m pip install -r tools/requirements.txt

      - name: Lint and validate against the official schema
        run: |
          set -euo pipefail
          shopt -s nullglob
          for dir in templates/*/ faces/*/; do
            dir=${dir%/}
            res="$dir/watchface/src/main/res"
            manifest="$dir/watchface/src/main/AndroidManifest.xml"
            version=$(grep -A1 'com.google.wear.watchface.format.version' "$manifest" | grep -o 'android:value="[0-9]*"' | grep -o '[0-9][0-9]*')
            echo "::group::$dir (Watch Face Format v$version)"
            python tools/wff_lint.py "$res/raw/watchface.xml" "$res"
            python tools/validate_wff.py "$res/raw/watchface.xml" --version "$version"
            echo "::endgroup::"
          done

      - name: Rebuild faces, run their checks, and compare with the committed files
        run: |
          set -euo pipefail
          shopt -s nullglob
          for build in faces/*/tools/build.py; do
            face=${build%/tools/build.py}
            echo "::group::$face"
            (cd "$face" && python tools/build.py)
            python tools/check_generated.py "$face"
            echo "::endgroup::"
          done

      - name: Upload preview renders
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: previews
          path: faces/*/tools/generated/previews/
          if-no-files-found: ignore
          retention-days: 14
